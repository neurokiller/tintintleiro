async function hashPassword(password) {
    const msgBuffer = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// CÁLCULO DE PP
function calculateAllPlayers() {
    let players = {}; let globalBestTime = 999999;
    leaderboardData.forEach(r => { if (r.mode === 'story' && r.tempo && r.tempo < globalBestTime) globalBestTime = r.tempo; });
    leaderboardData.forEach(run => {
        if (!players[run.nome]) players[run.nome] = { nome: run.nome, wins: 0, pp: 0, runs: [] };
        players[run.nome].runs.push(run);
        if (run.mode === 'story') {
            players[run.nome].wins++;
            if (run.tempo) players[run.nome].pp += Math.floor((globalBestTime / run.tempo) * 500);
        } else if (run.mode === 'arcade') {
            players[run.nome].pp += Math.floor(run.tempo * 10); 
        }
    });
    Object.values(players).forEach(p => { p.pp += p.wins * 20; p.runs.sort((a,b) => (a.tempo||99999) - (b.tempo||99999)); });
    return Object.values(players).sort((a, b) => b.pp - a.pp);
}

function getLeaderboardList() {
    if (leaderboardTab === 0) {
        let sorted = leaderboardData.filter(r => r.mode === 'story' || !r.mode).sort((a,b) => (a.tempo||99999) - (b.tempo||99999));
        let bestPerPlayer = {}, uniqueList = [];
        for (let run of sorted) { if (!bestPerPlayer[run.nome]) { bestPerPlayer[run.nome] = true; uniqueList.push(run); } }
        return uniqueList.slice(0, 10);
    } else if (leaderboardTab === 1) return calculateAllPlayers().slice(0, 10);
    else return [...leaderboardData].sort((a,b) => (b.timestamp||0) - (a.timestamp||0)).slice(0, 10);
}

function initAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playExplosionSound() {
    initAudioContext(); if (!audioCtx) return;
    const duration = 1.5, sampleRate = audioCtx.sampleRate, bufferSize = sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate); const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noiseNode = audioCtx.createBufferSource(); noiseNode.buffer = buffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(1000, audioCtx.currentTime); filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + duration);
    const gainNode = audioCtx.createGain(); gainNode.gain.setValueAtTime(1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    noiseNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
    const osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
    const oscGain = audioCtx.createGain(); oscGain.gain.setValueAtTime(1, audioCtx.currentTime); oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(oscGain); oscGain.connect(audioCtx.destination); noiseNode.start(); osc.start(); noiseNode.stop(audioCtx.currentTime + duration); osc.stop(audioCtx.currentTime + 0.5);
}
function updateAudioSpeed() { if (isDying) return; const safeSpeed = Math.min(gameSpeed, 16); if (bgm && !possessedMusicEnabled) { bgm.preservesPitch = true; bgm.playbackRate = safeSpeed; } if (possessedSource && possessedMusicEnabled) possessedSource.playbackRate.value = safeSpeed; }
function playAudio() { if (bgm && bgm.paused && !possessedMusicEnabled) { bgm.volume = 0.4; bgm.play().catch(e => console.log(e)); updateAudioSpeed(); } }
function triggerGlitchAudio() { if (!bgm || possessedMusicEnabled) return; try { bgm.playbackRate = 2.5; bgm.preservesPitch = false; } catch (e) { } }
function resetAudio() { if (!bgm) return; isDying = false; deathAudioTimer = 0; try { bgm.preservesPitch = true; updateAudioSpeed(); } catch (e) { } }
function startDeathEffect() { isDying = true; deathAudioTimer = 0; if (bgm) bgm.preservesPitch = false; }
function togglePossessedMusic(enabled) {
    if (!bgm) return;
    if (enabled) {
        bgm.pause(); initAudioContext();
        if (!reversedBuffer) {
            fetch('music.mp3').then(res => res.arrayBuffer()).then(buf => audioCtx.decodeAudioData(buf)).then(audioBuffer => {
                const numChan = audioBuffer.numberOfChannels, len = audioBuffer.length, rate = audioBuffer.sampleRate;
                const rev = audioCtx.createBuffer(numChan, len, rate);
                for (let c = 0; c < numChan; c++) { const cData = audioBuffer.getChannelData(c), rData = rev.getChannelData(c); for (let i = 0; i < len; i++) rData[i] = cData[len - 1 - i]; }
                reversedBuffer = rev; playReversed();
            }).catch(e => { bgm.preservesPitch = false; updateAudioSpeed(); bgm.play(); });
        } else playReversed();
    } else { if (possessedSource) { possessedSource.stop(); possessedSource = null; } updateAudioSpeed(); bgm.play(); }
}
function playReversed() { if (possessedSource) possessedSource.stop(); possessedSource = audioCtx.createBufferSource(); possessedSource.buffer = reversedBuffer; possessedSource.loop = true; updateAudioSpeed(); possessedSource.connect(audioCtx.destination); possessedSource.start(); }

function handleAction(action) {
    if (gameState === 'menu') {
        let totalItems = 5; // 0: Start, 1: Arcade, 2: Options, 3: Leaderboard, 4: Login/Logout
        if (action === 'up') menuIndex = (menuIndex + totalItems - 1) % totalItems;
        if (action === 'down') menuIndex = (menuIndex + 1) % totalItems;
        if (action === 'confirm' || action === 'cancel') {
            if (menuIndex === 0) initGame();
            else if (menuIndex === 1) setupArcade();
            else if (menuIndex === 2) gameState = 'options';
            else if (menuIndex === 3) { gameState = 'leaderboard'; fetchLeaderboard(); }
            else if (menuIndex === 4) {
                if (currentUser) {
                    currentUser = null;
                    localStorage.removeItem('tintintleiro_user');
                    menuIndex = 0;
                } else {
                    gameState = 'login';
                    loginInput = ""; loginPass = ""; loginMode = "username"; loginError = "";
                }
            }
        }
    } else if (gameState === 'login') {
        if (action === 'confirm') submitLogin();
        if (action === 'cancel') { gameState = 'menu'; loginError = ""; }
        if (action === 'left' || action === 'right') loginMode = loginMode === 'username' ? 'password' : 'username';
    } else if (gameState === 'options') {
        if (action === 'down') optionIndex = (optionIndex + 1) % 8;
        if (action === 'up') optionIndex = (optionIndex + 7) % 8;
        if (action === 'confirm' || action === 'cancel') {
            if (optionIndex === 0) bgTheme = 0;
            if (optionIndex === 1) bgTheme = 1;
            if (optionIndex === 2) bgTheme = 2;
            if (optionIndex === 3) autoFireEnabled = !autoFireEnabled;
            if (optionIndex === 4) { possessedMusicEnabled = !possessedMusicEnabled; togglePossessedMusic(possessedMusicEnabled); }
            if (optionIndex === 5) mouseControlEnabled = !mouseControlEnabled;
            if (optionIndex === 6) changeGameSpeed(1);
            if (optionIndex === 7) gameState = 'menu';
            saveSettings();
        }
    } else if (gameState === 'leaderboard') {
        if (action === 'left') { leaderboardTab = (leaderboardTab + 2) % 3; selectedRow = 0; }
        if (action === 'right') { leaderboardTab = (leaderboardTab + 1) % 3; selectedRow = 0; }
        let list = getLeaderboardList();
        if (action === 'up') selectedRow = Math.max(0, selectedRow - 1);
        if (action === 'down') selectedRow = Math.min(list.length - 1, selectedRow + 1);
        if (action === 'confirm' && list[selectedRow] && list[selectedRow].replay) startReplay(list[selectedRow]);
        if (action === 'profile' && list[selectedRow]) { profilePlayer = list[selectedRow].nome; gameState = 'profile'; }
        if (action === 'cancel') gameState = 'menu';
    } else if (gameState === 'profile') {
        if (action === 'cancel' || action === 'profile') gameState = 'leaderboard';
    } else if (gameState === 'replay') {
        if (action === 'cancel' || action === 'confirm') { gameState = 'leaderboard'; fetchLeaderboard(); selectedRow = 0; }
    } else if (gameState === 'levelCleared') {
        if (action === 'confirm' || action === 'cancel') { if (currentLevel < 6) setupLevel(currentLevel + 1); }
    } else if (gameState === 'gameOver' || gameState === 'gameWin' || gameState === 'arcadeOver') {
        if (action === 'confirm' || action === 'cancel') window.location.reload();
    } else if (gameState === 'playing' || gameState === 'arcadePlaying') {
        if (action === 'bomb' && bombs > 0 && bombCooldown <= 0) {
            bombs--; bullets = []; lasers = []; screenShake = 30; bombCooldown = 30;
            if (gameState === 'playing') boss.hp -= 300;
            playExplosionSound(); screenFlash = 1.0; 
            let bombLetters = [];
            for (let i = 0; i < 30; i++) bombLetters.push({ char: chineseChars[Math.floor(Math.random() * chineseChars.length)], angle: Math.random() * Math.PI * 2, dist: Math.random() * 100, speed: 10 + Math.random() * 20, size: 20 + Math.random() * 40 });
            bombEffects.push({ x: player.x, y: player.y, radius: 10, alpha: 1.0, letters: bombLetters });
            replayBombs.push(performance.now() - gameStartTime);
        }
    }
}

  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'backspace'].includes(k)) e.preventDefault();

  // LOGIN SCREEN INPUT LOGIC - BLOCKS ALL OTHER INPUTS

  }

let lastTime = performance.now(), accumulator = 0; const TIME_STEP = 1000 / 60; 
function gameLoop(currentTime) {
  if (!currentTime) currentTime = performance.now();
  let deltaTime = currentTime - lastTime; lastTime = currentTime; if (deltaTime > 100) deltaTime = 100; 
  accumulator += deltaTime * gameSpeed;
  let updates = 0; while (accumulator >= TIME_STEP) { update(); accumulator -= TIME_STEP; updates++; if (updates > 500) { accumulator = 0; break; } }
  draw(); requestAnimationFrame(gameLoop);
}
