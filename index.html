  } catch (e) {

  }
}

      headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
    });
    const getData = await getRes.json();

    let dateStr = new Date().toLocaleString(
        lang === 'pt' ? 'pt-BR' : (lang === 'cn' ? 'zh-CN' : 'en-US'), 
        { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }
    );

    let replayString = "";
    if (replayPath.length > 0) replayString = replayPath.join(",");

    lb.push({ 
        nome: nome, 
        tempo: tempo, 
        velocidade: speed, 
        metralhas: mguns, 
        data: dateStr,
        timestamp: Date.now(),
        replay: {
            s: initialSeed,
            p: replayString,
            b: replayBombs.join(",")
        }
    });
    
    if (lb.length > 1000) lb = lb.slice(-1000);

    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
      body: JSON.stringify({ leaderboard: lb })
    });
    
    leaderboardData = lb;
  } catch (e) { console.error(e); } finally { isSavingScore = false; }
}

function calculateAllPlayers() {
    let players = {};
    let globalBestTime = 999999;

    leaderboardData.forEach(r => {
        if (r.tempo && r.tempo < globalBestTime) globalBestTime = r.tempo;
    });

    leaderboardData.forEach(run => {
        if (!players[run.nome]) {
            players[run.nome] = { nome: run.nome, wins: 0, pp: 0, runs: [] };
        }
        players[run.nome].wins++;
        players[run.nome].runs.push(run);

        if (run.tempo) {
            let timePP = Math.floor((globalBestTime / run.tempo) * 500);
            players[run.nome].pp += timePP;
        }
    });

    Object.values(players).forEach(p => {
        p.pp += p.wins * 20; 
        // Ordena as runs do jogador da mais rápida para a mais lenta
        p.runs.sort((a,b) => (a.tempo||99999) - (b.tempo||99999));
    });

    return Object.values(players).sort((a, b) => b.pp - a.pp);
}

function getLeaderboardList() {
    if (leaderboardTab === 0) {
        let sorted = [...leaderboardData].sort((a,b) => (a.tempo||99999) - (b.tempo||99999));
        let bestPerPlayer = {};
        let uniqueList = [];
        for (let run of sorted) {
            if (!bestPerPlayer[run.nome]) {
                bestPerPlayer[run.nome] = true;
                uniqueList.push(run);
            }
        }
        return uniqueList.slice(0, 10);
    } else if (leaderboardTab === 1) {
        return calculateAllPlayers().slice(0, 10);
    } else {
        let recent = [...leaderboardData].sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
        return recent.slice(0, 10);
    }
}

function initAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playExplosionSound() {
    initAudioContext();
    if (!audioCtx) return;

    const duration = 1.5;
    const sampleRate = audioCtx.sampleRate;
    const bufferSize = sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + duration);

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

    noiseNode.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
    
    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(1, audioCtx.currentTime);
    oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(oscGain);
    oscGain.connect(audioCtx.destination);

    noiseNode.start();
    osc.start();
    noiseNode.stop(audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + 0.5);
}

function updateAudioSpeed() {
    if (isDying) return;
    const safeSpeed = Math.min(gameSpeed, 16); 
    if (bgm && !possessedMusicEnabled) {
        bgm.preservesPitch = true;
        bgm.playbackRate = safeSpeed;
    }
    if (possessedSource && possessedMusicEnabled) {
        possessedSource.playbackRate.value = safeSpeed;
    }
}

function playAudio() {
  if (bgm && bgm.paused && !possessedMusicEnabled) {
    bgm.volume = 0.4;

  }
}

function triggerGlitchAudio() {
  if (!bgm || possessedMusicEnabled) return;
  try { bgm.playbackRate = 2.5; bgm.preservesPitch = false; } catch (e) { }
}

function resetAudio() {
  if (!bgm) return;
  isDying = false;
  deathAudioTimer = 0;
  try { bgm.preservesPitch = true; updateAudioSpeed(); } catch (e) { }
}

function togglePossessedMusic(enabled) {
    if (!bgm) return;
    if (enabled) {
        bgm.pause();
        initAudioContext();
        
        if (!reversedBuffer) {
            fetch('music.mp3')
                .then(res => res.arrayBuffer())
                .then(buf => audioCtx.decodeAudioData(buf))
                .then(audioBuffer => {
                    const numChan = audioBuffer.numberOfChannels;
                    const len = audioBuffer.length;
                    const rate = audioBuffer.sampleRate;
                    const rev = audioCtx.createBuffer(numChan, len, rate);
                    for (let c = 0; c < numChan; c++) {
                        const cData = audioBuffer.getChannelData(c);
                        const rData = rev.getChannelData(c);
                        for (let i = 0; i < len; i++) rData[i] = cData[len - 1 - i];
                    }
                    reversedBuffer = rev;
                    playReversed();
                })
                .catch(e => { bgm.preservesPitch = false; updateAudioSpeed(); bgm.play(); });
        } else playReversed();
    } else {
        if (possessedSource) { possessedSource.stop(); possessedSource = null; }
        updateAudioSpeed();
        bgm.play();
    }
}

function playReversed() {
    if (possessedSource) possessedSource.stop();
    possessedSource = audioCtx.createBufferSource();
    possessedSource.buffer = reversedBuffer;
    possessedSource.loop = true;
    updateAudioSpeed();
    possessedSource.connect(audioCtx.destination);
    possessedSource.start();
}

function startDeathEffect() {

function changeGameSpeed(dir) {
    if (dir > 0) gameSpeed = Math.min(99.00, parseFloat((gameSpeed + 0.05).toFixed(2)));
    else gameSpeed = Math.max(0.05, parseFloat((gameSpeed - 0.05).toFixed(2)));
    saveSettings();
    updateAudioSpeed();
}

function handleAction(action) {
    if (gameState === 'menu') {
        if (action === 'up') menuIndex = (menuIndex + 2) % 3;
        if (action === 'down') menuIndex = (menuIndex + 1) % 3;
        if (action === 'confirm' || action === 'cancel') {
            if (menuIndex === 0) initGame();
            else if (menuIndex === 1) gameState = 'options';
            else if (menuIndex === 2) { gameState = 'leaderboard'; fetchLeaderboard(); }
        }
    } else if (gameState === 'options') {
        if (action === 'down') optionIndex = (optionIndex + 1) % 8;
        if (action === 'up') optionIndex = (optionIndex + 7) % 8;
        
        if (action === 'confirm' || action === 'cancel') {
            if (optionIndex === 0) bgTheme = 0;
            if (optionIndex === 1) bgTheme = 1;
            if (optionIndex === 2) bgTheme = 2;
            if (optionIndex === 3) autoFireEnabled = !autoFireEnabled;
            if (optionIndex === 4) { possessedMusicEnabled = !possessedMusicEnabled; togglePossessedMusic(possessedMusicEnabled); }
            if (optionIndex === 5) mouseControlEnabled = !mouseControlEnabled;
            if (optionIndex === 6) changeGameSpeed(1);
            if (optionIndex === 7) gameState = 'menu';
            saveSettings();
        }
    } else if (gameState === 'leaderboard') {
        if (action === 'left') { leaderboardTab = (leaderboardTab + 2) % 3; selectedRow = 0; }
        if (action === 'right') { leaderboardTab = (leaderboardTab + 1) % 3; selectedRow = 0; }
        
        let list = getLeaderboardList();
        if (action === 'up') selectedRow = Math.max(0, selectedRow - 1);
        if (action === 'down') selectedRow = Math.min(list.length - 1, selectedRow + 1);
        
        if (action === 'confirm') { 
            if (list[selectedRow] && list[selectedRow].replay) {
                startReplay(list[selectedRow]);
            }
        }
        if (action === 'profile') {
            if (list[selectedRow]) {
                profilePlayer = list[selectedRow].nome;
                gameState = 'profile';
            }
        }
        if (action === 'cancel') { 
            gameState = 'menu'; 
        }
    } else if (gameState === 'profile') {
        if (action === 'cancel' || action === 'profile') {
            gameState = 'leaderboard';
        }
    } else if (gameState === 'replay') {
        if (action === 'cancel' || action === 'confirm') { 
            gameState = 'leaderboard'; 
            fetchLeaderboard();
            selectedRow = 0;
        }
    } else if (gameState === 'levelCleared') {
        if (action === 'confirm' || action === 'cancel') {
            if (currentLevel < 6) setupLevel(currentLevel + 1);
        }
    } else if (gameState === 'gameOver' || gameState === 'gameWin') {
        if (action === 'confirm' || action === 'cancel') window.location.reload();
    } else if (gameState === 'playing') {
        if (action === 'bomb' && bombs > 0 && bombCooldown <= 0) {
            bombs--; bullets = []; lasers = []; boss.hp -= 300; screenShake = 30; bombCooldown = 30;
            playExplosionSound();
            screenFlash = 1.0; 
            
            let bombLetters = [];
            for (let i = 0; i < 30; i++) {
                bombLetters.push({
                    char: chineseChars[Math.floor(Math.random() * chineseChars.length)],
                    angle: Math.random() * Math.PI * 2,
                    dist: Math.random() * 100,
                    speed: 10 + Math.random() * 20,
                    size: 20 + Math.random() * 40
                });
            }
            bombEffects.push({ x: player.x, y: player.y, radius: 10, alpha: 1.0, letters: bombLetters });
            replayBombs.push(boss.timer);
        }
    }
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'backspace'].includes(k)) e.preventDefault();
  
  if (gameState === 'options' && optionIndex === 6) {
      if (k === 'arrowleft' || k === 'a') { changeGameSpeed(-1); return; }
      if (k === 'arrowright' || k === 'd') { changeGameSpeed(1); return; }
  }

  if (keys[k]) return; 
  keys[k] = true;
  
  if (k === 'l') toggleLanguage();
  
  if (gameState === 'nameInput') {
    if (k === 'enter') {
      if (playerNameInput.trim().length > 0 && !isSavingScore) { 
          saveScore(playerNameInput.trim(), finalRunTime, gameSpeed, machineGunCount); 
          gameState = 'leaderboard'; 
          leaderboardTab = 0; 
          fetchLeaderboard();
          playerNameInput = ""; 
      }
    } else if (k === 'backspace') playerNameInput = playerNameInput.slice(0, -1);
    else if (k.length === 1 && /^[a-zA-Z0-9 ]$/.test(k) && playerNameInput.length < 12) playerNameInput += k;
  } else {
    if (k === 'arrowup' || k === 'w') handleAction('up');
    if (k === 'arrowdown' || k === 's') handleAction('down');
    if (k === 'arrowleft' || k === 'a') handleAction('left');
    if (k === 'arrowright' || k === 'd') handleAction('right');
    
    if (k === 'enter' || k === ' ') handleAction('confirm');
    if (k === 'p') handleAction('profile');
    if (k === 'z' || k === 'escape') handleAction('cancel');
    
    if (k === 'x') handleAction('bomb');
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

canvas.addEventListener('pointerdown', e => {
    const pos = getPointerPos(e);
    isDragging = true;
    targetX = pos.x; targetY = pos.y;

    if (possessedMusicEnabled && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (pos.x > W - 150 && pos.y < 60) { toggleLanguage(); return; }

    if (isMobile) {
        if (gameState === 'menu') {
            if (pos.y > H/2 - 70 && pos.y < H/2 - 10) { menuIndex = 0; handleAction('confirm'); }
            else if (pos.y > H/2 && pos.y < H/2 + 60) { menuIndex = 1; handleAction('confirm'); }
            else if (pos.y > H/2 + 70 && pos.y < H/2 + 130) { menuIndex = 2; handleAction('confirm'); }
        } else if (gameState === 'options') {
            for(let i=0; i<8; i++) {
                if (pos.y > 180 + i*50 && pos.y < 230 + i*50) { 
                    optionIndex = i;
                    if (i === 6) {
                        if (pos.x < W / 2) changeGameSpeed(-1);
                        else changeGameSpeed(1);
                    } else handleAction('confirm'); 
                }
            }
        } else if (gameState === 'leaderboard') {
            if (pos.y > 120 && pos.y < 160) {
                if (pos.x < W/3) { leaderboardTab = 0; selectedRow = 0; }
                else if (pos.x < 2*W/3) { leaderboardTab = 1; selectedRow = 0; }
                else { leaderboardTab = 2; selectedRow = 0; }
            } else if (pos.y > H - 80 && pos.y < H - 20) {
                handleAction('cancel');
            } else {
                let list = getLeaderboardList();
                for (let i = 0; i < list.length; i++) {
                    let y = 260 + i * 35;
                    if (pos.y > y - 20 && pos.y < y + 15) {
                        selectedRow = i;
                        // No mobile, se clicar na linha joga o replay direto (se existir)
                        if (list[i].replay) startReplay(list[i]);
                        return;
                    }
                }
            }
        } else if (gameState === 'profile') {
            handleAction('cancel');
        } else if (gameState === 'replay') {
            handleAction('cancel');
        } else if (gameState === 'levelCleared' || gameState === 'gameOver' || gameState === 'gameWin') {
            handleAction('confirm');
        } else if (gameState === 'playing') {
            if (pos.x > W - 120 && pos.y > H - 120) handleAction('bomb');
        }
    }
});

canvas.addEventListener('pointermove', e => {
    const pos = getPointerPos(e);
    targetX = pos.x; targetY = pos.y;
});
canvas.addEventListener('pointerup', () => isDragging = false);
canvas.addEventListener('pointercancel', () => isDragging = false);

// ==========================================
// UPDATE (LÓGICA)
// ==========================================
function update() {
  if (isDying) {
      deathAudioTimer++;
      let rate = Math.max(0.05, (gameSpeed * 0.5) - (deathAudioTimer * 0.015));
      if (bgm && !possessedMusicEnabled) bgm.playbackRate = rate;
      if (possessedSource && possessedMusicEnabled) possessedSource.playbackRate.value = rate;
      
      if (deathAudioTimer > 150) {
          if (bgm) bgm.pause();
          if (possessedSource) possessedSource.stop();
          isDying = false;
      }
      return;
  }

  if (gameState !== 'playing' && gameState !== 'replay') screenShake = 0; 
  if (gameState !== 'playing' && gameState !== 'levelCleared' && gameState !== 'gameOver' && gameState !== 'gameWin' && gameState !== 'replay') return;

  if (machineGunEvent === 1) {
    machineGunTimer--; screenShake = 50;
    if (machineGunTimer <= 0) { machineGunEvent = 2; machineGunTimer = 240; }
    return; 
  }
  
  if (gameState !== 'playing' && gameState !== 'replay') return;
  
  if (bombCooldown > 0) bombCooldown--;
  if (screenShake > 0) screenShake--; 
  if (screenFlash > 0) screenFlash -= 0.05; 

  for (let i = bombEffects.length - 1; i >= 0; i--) {
      let be = bombEffects[i];
      be.radius += 40; 
      be.alpha -= 0.02; 
      for (let l of be.letters) {
          l.dist += l.speed;
          l.size += 1;
      }
      if (be.alpha <= 0) bombEffects.splice(i, 1);
  }

  if (gameState === 'playing') {
      currentRunTime = (performance.now() - gameStartTime) / 1000;
      
      if (isMobile || mouseControlEnabled) {
          player.x += (targetX - player.x) * 0.4;
          player.y += (targetY - player.y) * 0.4;
      } else {
          if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
          if (keys['arrowright'] || keys['d']) player.x += player.speed;
          if (keys['arrowup'] || keys['w']) player.y -= player.speed;
          if (keys['arrowdown'] || keys['s']) player.y += player.speed;
      }
      
      player.x = Math.max(20, Math.min(W - 20, player.x));
      player.y = Math.max(20, Math.min(H - 20, player.y));
      if (player.cooldown > 0) player.cooldown--;

      if ((keys['z'] || keys[' '] || autoFireEnabled || isMobile) && player.cooldown <= 0) {
          playerBullets.push({ x: player.x, y: player.y - 20, r: 6, vy: -18, damage: 25 });
          player.cooldown = 4;
      }
      
      if (boss.timer % 4 === 0 && replayPath.length < 10000) {
          replayPath.push(Math.round(player.x), Math.round(player.y), Math.round(boss.hp), player.lives, bombs);
      }
  } else if (gameState === 'replay') {
      let groupSize = (replayPath.length % 5 === 0 && replayPath.length > 0) ? 5 : 3;
      let idx = Math.floor(boss.timer / 4) * groupSize;
      if (idx < replayPath.length) {
          player.x = replayPath[idx];
          player.y = replayPath[idx+1];
          boss.hp = replayPath[idx+2];
          if (groupSize === 5) {
              player.lives = replayPath[idx+3];
              bombs = replayPath[idx+4];
          }
          if (boss.timer % 4 === 0) {
              playerBullets.push({ x: player.x, y: player.y - 20, r: 6, vy: -18, damage: 25 });
          }
      } else {
          gameState = 'leaderboard';
          return;
      }
  }

  let speedMult = 1 + (currentLevel * 0.15);
  boss.x = W/2 + Math.sin(boss.timer / (80 / speedMult)) * 200;
  boss.y = 200 + Math.cos(boss.timer / (100 / speedMult)) * 50;
  boss.timer++;

  let fireRate = Math.max(8, 25 - (currentLevel * 2)); 
  let bulletSpeed = 3.5 + (currentLevel * 0.4);
  let laserRate = Math.max(80, 220 - (currentLevel * 25));

  if (machineGunEvent === 0 && boss.timer % Math.floor(fireRate) === 0) {
    const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
    let spread = Math.min(4, 1 + Math.floor(currentLevel / 2)); 
    for(let i = -spread; i <= spread; i++) {
      bullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle + i * 0.2) * bulletSpeed, vy: Math.sin(angle + i * 0.2) * bulletSpeed, r: 10, color: ['#0f0', '#f00', '#ff0', '#00f', '#ffa500'][Math.floor(rand() * 5)] });
    }
  }

  if (machineGunEvent === 0 && boss.timer % Math.floor(laserRate) === 0) {
    const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
    lasers.push({ angle: angle, life: 70, warning: 40 });
    if (currentLevel === 6) lasers.push({ angle: angle + Math.PI/4, life: 70, warning: 40 });
  }

  if (machineGunEvent === 0 && rand() < 0.0005) { 
    machineGunEvent = 1; 
    machineGunTimer = 120; 
    bullets = []; lasers = [];
    if (gameState === 'playing') machineGunCount++; 
  }

  if (machineGunEvent === 2) {
    machineGunTimer--;
    if (machineGunTimer % 2 === 0) {
      for (let i = 0; i < 8; i++) {
        let a = rand() * Math.PI * 2;
        bullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 8, vy: Math.sin(a) * 8, r: 8, color: '#f00' });
      }
    }
    if (rand() < 0.8 && extraLives.length < 100) { 
      extraLives.push({ x: rand() * (W - 60) + 30, y: rand() * (H - 60) + 30, r: 20, floatOffset: rand() * Math.PI * 2 });
    }
    for (let i = extraLives.length - 1; i >= 0; i--) {
      let el = extraLives[i];
      el.floatOffset += 0.1;
      let dx = el.x - player.x; let dy = el.y - player.y;
      if (gameState === 'playing' && dx*dx + dy*dy < (el.r + player.r)*(el.r + player.r)) { player.lives += 5; extraLives.splice(i, 1); }
    }
    if (machineGunTimer <= 0) { machineGunEvent = 0; extraLives = []; }
  }

  if (invulnerable > 0) invulnerable--;

  if (gameState === 'replay') {
      for (let i = playerBullets.length - 1; i >= 0; i--) {
          let pb = playerBullets[i];
          pb.y += pb.vy;
          if (pb.y < 0) playerBullets.splice(i, 1);
      }
      for (let i = bullets.length - 1; i >= 0; i--) {
          let b = bullets[i];
          b.x += b.vx; b.y += b.vy;
          if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) bullets.splice(i, 1);
      }
      for (let i = lasers.length - 1; i >= 0; i--) {
          let l = lasers[i];
          l.life--; l.warning--;
          if (l.life <= 0) lasers.splice(i, 1);
      }
      if (replayBombs.includes(boss.timer)) {
          bullets = []; lasers = [];
          playExplosionSound();
          screenFlash = 1.0;
          let bombLetters = [];
          for (let i = 0; i < 30; i++) {
              bombLetters.push({ char: chineseChars[Math.floor(Math.random() * chineseChars.length)], angle: Math.random() * Math.PI * 2, dist: Math.random() * 100, speed: 10 + Math.random() * 20, size: 20 + Math.random() * 40 });
          }
          bombEffects.push({ x: player.x, y: player.y, radius: 10, alpha: 1.0, letters: bombLetters });
      }
      return; 
  }

  for (let i = playerBullets.length - 1; i >= 0; i--) {
    let pb = playerBullets[i];
    if (!pb) continue;
    pb.y += pb.vy;
    let dx = pb.x - boss.x; let dy = pb.y - boss.y;
    if (dx*dx + dy*dy < (boss.r + pb.r)*(boss.r + pb.r)) {
      boss.hp -= pb.damage; playerBullets.splice(i, 1);
      if (boss.hp <= 0) { 
        boss.hp = 0; 
        if (currentLevel === 6) { finalRunTime = currentRunTime; gameState = 'nameInput'; playerNameInput = ""; } 
        else { gameState = 'levelCleared'; }
        triggerGlitchAudio(); 
      }
    } else if (pb.y < 0) playerBullets.splice(i, 1);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    if (!b) continue;
    b.x += b.vx; b.y += b.vy;
    let dx = b.x - player.x; let dy = b.y - player.y;
    if (invulnerable <= 0 && dx*dx + dy*dy < (b.r + player.r)*(b.r + player.r)) {
      player.lives--; invulnerable = 120; bullets = []; screenShake = 20;
      if (player.lives <= 0) { gameState = 'gameOver'; screenShake = 0; startDeathEffect(); }
      break;
    }
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) bullets.splice(i, 1);
  }

  for (let i = lasers.length - 1; i >= 0; i--) {
    let l = lasers[i];
    if (!l) continue;
    l.life--; l.warning--;
    if (l.warning <= 0 && invulnerable <= 0) {
      let dist = Math.abs((player.x - boss.x) * Math.sin(l.angle) - (player.y - boss.y) * Math.cos(l.angle));
      if (dist < 25) {
        player.lives--; invulnerable = 120; bullets = []; screenShake = 20;
        if (player.lives <= 0) { gameState = 'gameOver'; screenShake = 0; startDeathEffect(); }
      }
    }
    if (l.life <= 0) lasers.splice(i, 1);
  }
}

// ==========================================
// DRAW (RENDERIZAÇÃO)
// ==========================================
function draw() {
  ctx.save();
  if (screenShake > 0 && (gameState === 'playing' || gameState === 'replay')) {
      ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  if (bgTheme === 0) ctx.drawImage(bgCanvas, 0, 0);
  else if (bgTheme === 1) { ctx.fillStyle = '#000'; ctx.fillRect(-50, -50, W + 100, H + 100); }
  else if (bgTheme === 2) {
    ctx.fillStyle = '#DE2910'; ctx.fillRect(-50, -50, W + 100, H + 100);
    ctx.fillStyle = '#FFDE00';
    for(let i=0; i<chinaStars.length; i++) { let s = chinaStars[i]; ctx.font = `bold ${s.size}px Arial`; ctx.fillText("★", s.x, s.y); }
  }

  if (gameState === 'playing' || gameState === 'levelCleared' || gameState === 'replay') {
      for (let be of bombEffects) {
          ctx.save();
          ctx.globalAlpha = be.alpha;
          let gradient = ctx.createRadialGradient(be.x, be.y, be.radius * 0.1, be.x, be.y, be.radius);
          gradient.addColorStop(0, 'rgba(255, 0, 0, 0.8)');
          gradient.addColorStop(0.5, 'rgba(255, 0, 0, 0.4)');
          gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
          ctx.fillStyle = gradient;
          ctx.beginPath(); ctx.arc(be.x, be.y, be.radius, 0, Math.PI*2); ctx.fill();
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          for (let l of be.letters) {
              let lx = be.x + Math.cos(l.angle) * l.dist;
              let ly = be.y + Math.sin(l.angle) * l.dist;
              ctx.fillStyle = '#ff0000'; ctx.font = `bold ${l.size}px "Noto Sans CJK SC", sans-serif`;
              ctx.fillText(l.char, lx, ly);
          }
          ctx.restore();
      }
  }

  if (screenFlash > 0) {
      ctx.fillStyle = `rgba(255, 0, 0, ${screenFlash * 0.6})`;
      ctx.fillRect(-50, -50, W + 100, H + 100);
  }

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(W - 140, 10, 130, 40);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(W - 140, 10, 130, 40);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
  let flag = lang === 'en' ? "EN 🇺🇸" : lang === 'pt' ? "PT 🇧🇷" : "CN 🇨🇳";
  ctx.fillText(flag, W - 75, 35);
  ctx.restore();

  if (gameState === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f00'; ctx.font = 'bold 70px Impact, sans-serif';
    ctx.fillText("TINTINTLEIRO", W/2, H/2 - 180);

    ctx.font = 'bold 35px monospace';
    ctx.fillStyle = menuIndex === 0 ? '#0f0' : '#fff';
    ctx.fillText(menuIndex === 0 ? "> " + t('start') + " <" : t('start'), W/2, H/2 - 40);
    ctx.fillStyle = menuIndex === 1 ? '#0f0' : '#fff';
    ctx.fillText(menuIndex === 1 ? "> " + t('options') + " <" : t('options'), W/2, H/2 + 30);
    ctx.fillStyle = menuIndex === 2 ? '#0f0' : '#fff';
    ctx.fillText(menuIndex === 2 ? "> " + t('leaderboard') + " <" : t('leaderboard'), W/2, H/2 + 100);

    ctx.fillStyle = '#888'; ctx.font = 'bold 16px monospace';
    ctx.fillText(t('madeBy'), W/2, H - 80);
  } 
  else if (gameState === 'options') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f00'; ctx.font = 'bold 50px Impact, sans-serif';

    const optionsList = [t('bgOrig'), t('bgBlack'), t('bgChina'), t('autoFire'), t('possessedMusic'), t('mouseCtrl'), t('gameSpeed'), t('back')];

        ctx.fillStyle = optionIndex === i ? '#0f0' : '#fff';
        ctx.fillText((optionIndex === i ? "> " : "") + text, W/2, 180 + i * 50);
    }
    if (optionIndex === 6) {

                let mGunStr = entry.metralhas !== undefined ? entry.metralhas : "-";
                let dateStr = entry.data || "Antigo";
                
                ctx.textAlign = "left"; ctx.fillText(`${entry.nome}`, 40, y); 
                ctx.textAlign = "center"; ctx.fillText(timeStr, 220, y); 
                ctx.fillText(spdStr, 310, y); ctx.fillText(mGunStr, 390, y);
                ctx.fillText(dateStr, 520, y);

                if (entry.replay) {
                    ctx.fillStyle = i === selectedRow ? '#fff' : '#0ff'; 
                    ctx.fillText(t('replay'), 680, y);
                }
            }
        }
    }
    ctx.textAlign = 'center'; 
    ctx.fillStyle = '#0f0'; ctx.font = 'bold 20px monospace'; 
    ctx.fillText(t('controls'), W/2, H - 40);
  }
  else if (gameState === 'profile') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f00'; ctx.font = 'bold 40px Impact, sans-serif';
    ctx.fillText(t('profileTitle'), W/2, 60);

    let allPlayers = calculateAllPlayers();
    let p = allPlayers.find(pl => pl.nome === profilePlayer);
    
    if (p) {
        ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace';
        ctx.fillText(p.nome, W/2, 110);
        
        ctx.fillStyle = '#ff0'; ctx.font = 'bold 24px monospace';
        ctx.fillText(`${t('totalPP')}: ${p.pp}`, W/2 - 150, 150);
        ctx.fillStyle = '#0ff';
        ctx.fillText(`${t('totalWins')}: ${p.wins}`, W/2 + 150, 150);
        
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace';
        ctx.fillText(t('runHistory'), W/2, 190);
        
        ctx.fillStyle = '#aaa'; ctx.font = '16px monospace';
        ctx.fillText(t('time'), W/2 - 200, 220);
        ctx.fillText(t('speed'), W/2, 220);
        ctx.fillText(t('date'), W/2 + 200, 220);

        for (let i = 0; i < Math.min(p.runs.length, 15); i++) {
            let r = p.runs[i];
            let y = 250 + i * 30;
            ctx.fillStyle = i === 0 ? '#ff0' : '#ddd';
            ctx.fillText(r.tempo.toFixed(2) + "s", W/2 - 200, y);
            ctx.fillText(r.velocidade.toFixed(2) + "x", W/2, y);
            ctx.fillText(r.data || "--", W/2 + 200, y);
        }
    }

    ctx.textAlign = 'center'; ctx.fillStyle = '#0f0'; ctx.font = 'bold 24px monospace'; 
    ctx.fillText("[ P / Z ] " + t('back'), W/2, H - 40);
  }
  else if (gameState === 'nameInput') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f00'; ctx.font = 'bold 70px Impact, sans-serif';
    ctx.fillText(t('survived'), W/2, H/2 - 140);
    ctx.fillStyle = '#0ff'; ctx.font = 'bold 40px monospace';
    ctx.fillText(`${t('timeLabel')} ${finalRunTime.toFixed(2)}s`, W/2, H/2 - 60);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace'; 
    ctx.fillText(t('yourName'), W/2, H/2);
    ctx.strokeStyle = '#0f0'; ctx.lineWidth = 3; ctx.strokeRect(W/2 - 200, H/2 + 20, 400, 60);
    ctx.fillStyle = '#0f0'; ctx.font = 'bold 36px monospace';
    let cursor = (Math.floor(Date.now() / 500) % 2 === 0) ? "|" : "";
    ctx.fillText(playerNameInput + cursor, W/2, H/2 + 62);
    ctx.fillStyle = '#fff'; ctx.font = '20px monospace'; 
    ctx.fillText(t('enterName'), W/2, H/2 + 120);
  }
  else {
    if (gameState !== 'gameOver' && gameState !== 'gameWin') {
      if (gameState === 'replay') {
          ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, 80);
          ctx.fillStyle = '#f00'; ctx.font = 'bold 40px Impact, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(t('replayMode'), W/2, 45);
          ctx.fillStyle = '#fff'; ctx.font = '20px monospace';
          ctx.fillText(t('exitReplay'), W/2, 75);
      }

      ctx.save(); ctx.translate(boss.x, boss.y);
      if (bossImg.complete && bossImg.naturalWidth !== 0) ctx.drawImage(bossImg, -boss.r, -boss.r, boss.r * 2, boss.r * 2);
      else { ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(0, 0, boss.r, 0, Math.PI*2); ctx.fill(); }
      ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(-30, -20, 10, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(30, -20, 10, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      for (let l of lasers) {
        const eyeX = boss.x + (Math.cos(l.angle) > 0 ? 30 : -30); const eyeY = boss.y - 20;
        if (l.warning > 0) { ctx.strokeStyle = `rgba(255, 0, 0, ${Math.random() * 0.6 + 0.2})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(eyeX, eyeY); ctx.lineTo(eyeX + Math.cos(l.angle) * 2000, eyeY + Math.sin(l.angle) * 2000); ctx.stroke(); }
        else {
          ctx.strokeStyle = '#f00'; ctx.lineWidth = 30; ctx.beginPath(); ctx.moveTo(eyeX, eyeY); ctx.lineTo(eyeX + Math.cos(l.angle) * 2000, eyeY + Math.sin(l.angle) * 2000); ctx.stroke();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(eyeX, eyeY); ctx.lineTo(eyeX + Math.cos(l.angle) * 2000, eyeY + Math.sin(l.angle) * 2000); ctx.stroke();
        }
      }

      for (let pb of playerBullets) {
        ctx.save(); ctx.shadowBlur = 15; ctx.shadowColor = '#ff0000';
        ctx.fillStyle = '#ff2222'; ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      }

      for (let b of bullets) { 
        ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); 
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); 
      }

      if (machineGunEvent === 2) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (let el of extraLives) {
          let floatY = el.y + Math.sin(el.floatOffset) * 5;
          ctx.fillStyle = '#0f0'; ctx.font = 'bold 40px Arial'; ctx.fillText("❤", el.x, floatY);
          ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(el.x, floatY, 20, 0, Math.PI * 2); ctx.stroke();
        }
      }

      ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(-Math.PI / 8);
      if (invulnerable > 0 && Math.floor(boss.timer / 5) % 2 === 0) ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.ellipse(0, 12, 12, 16, 0, 0, Math.PI*2); ctx.fill(); 
      ctx.fillStyle = '#D2B48C'; ctx.fillRect(-4, -30, 8, 35); 
      ctx.fillStyle = '#8B4513'; ctx.fillRect(-6, -36, 12, 8); 
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-2, -35); ctx.lineTo(-2, 20); ctx.stroke(); ctx.beginPath(); ctx.moveTo(2, -35); ctx.lineTo(2, 20); ctx.stroke();
      ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(0, 12, 3, 0, Math.PI*2); ctx.fill(); 
      ctx.restore();

      if (isMobile && gameState === 'playing') {
          ctx.fillStyle = 'rgba(255,0,0,0.4)'; ctx.beginPath(); ctx.arc(W - 80, H - 80, 50, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#f00'; ctx.lineWidth = 4; ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText("💣", W - 80, H - 80);
      }

      if (gameState === 'playing' || gameState === 'replay') {
          ctx.fillStyle = '#111'; ctx.fillRect(100, 40, 600, 40); ctx.strokeStyle = '#f00'; ctx.lineWidth = 4; ctx.strokeRect(100, 40, 600, 40);
          let bossMaxHp = (gameState === 'playing') ? boss.maxHp : (1500 + (6 * 800));
          let hpWidth = 600 * (boss.hp / bossMaxHp); 
          ctx.fillStyle = boss.hp > (bossMaxHp/2) ? '#f00' : '#ff0'; ctx.fillRect(100, 40, Math.max(0, hpWidth), 40);
          
          ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = "center"; 
          ctx.fillText(`TINTINTLEIRO - ${t('level')} 6`, W/2, 70);
          
          ctx.textAlign = "right"; ctx.font = 'bold 26px monospace'; ctx.fillStyle = '#0ff';
          if (gameState === 'playing') ctx.fillText(`${t('time')} ${currentRunTime.toFixed(2)}s`, W - 30, 130);
          else if (gameState === 'replay') ctx.fillText(`${t('time')} ${gameSpeed.toFixed(2)}x`, W - 30, 130);

          ctx.textAlign = "left"; ctx.font = 'bold 24px monospace'; ctx.fillStyle = '#f00';
          if (player.lives > 10) ctx.fillText(`${t('lives')} ❤ x ${player.lives}`, 100, 120);
          else ctx.fillText(t('lives') + " " + "❤".repeat(player.lives), 100, 120);
          ctx.fillStyle = '#0ff'; ctx.font = 'bold 20px monospace'; ctx.fillText(`${t('bombs')} ${bombs} [X]`, 100, 150);
          
          if (gameSpeed !== 1.0 && gameState === 'playing') { 
              ctx.textAlign = "right"; ctx.fillStyle = '#ff0'; ctx.font = 'bold 20px monospace'; 
              ctx.fillText(`SPEED: ${gameSpeed.toFixed(2)}x`, W - 30, 160); 
          }
      }
    }

    if (machineGunEvent === 1 && gameState === 'playing') {
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(Math.random()*30-15, Math.random()*30-15); ctx.textAlign = 'center';
      ctx.fillStyle = '#f00'; ctx.font = 'bold 70px Impact, sans-serif'; ctx.fillText("CRAZY CHINESE", W/2, H/2 - 40); ctx.fillText("MACHINEGUN!!!11!!!!", W/2, H/2 + 40);
      for(let i=0; i<15; i++) { ctx.fillStyle = Math.random() > 0.5 ? '#ff0' : '#fff'; ctx.font = `bold ${20 + Math.random()*50}px sans-serif`; ctx.fillText("DUDUDUDUDU", Math.random()*W, Math.random()*H); }
      ctx.restore();
    }

    if (gameState === 'levelCleared' || gameState === 'gameWin' || gameState === 'gameOver') {
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center';
      if (gameState === 'levelCleared') {
        ctx.fillStyle = '#0f0'; ctx.font = 'bold 80px Impact, sans-serif'; ctx.fillText(t('youWin'), W/2, H/2 - 100);
        for(let i=0; i<20; i++) { ctx.fillStyle = Math.random() > 0.5 ? '#0f0' : '#fff'; ctx.font = `bold ${20 + Math.random() * 60}px Impact, sans-serif`; ctx.fillText(t('youWin'), Math.random()*W, Math.random()*H); }
        ctx.fillStyle = '#fff'; ctx.font = 'bold 40px monospace'; ctx.fillText(t('pressContinue'), W/2, H - 100);
      } else if (gameState === 'gameWin') {
        ctx.fillStyle = '#0f0'; ctx.font = 'bold 70px Impact, sans-serif'; ctx.fillText(t('survived'), W/2, H/2 - 100);
        for(let i=0; i<25; i++) { ctx.fillStyle = Math.random() > 0.5 ? '#0f0' : '#fff'; ctx.font = `bold ${20 + Math.random() * 60}px Impact, sans-serif`; ctx.fillText(glitchText[Math.floor(Math.random() * glitchText.length)], Math.random()*W, Math.random()*H); }
        ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace'; ctx.fillText(t('return'), W/2, H - 100);
      } else {
        ctx.fillStyle = '#f00'; ctx.font = 'bold 80px Impact, sans-serif'; ctx.fillText(t('youDied'), W/2, H/2 - 50);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace'; ctx.fillText(t('return'), W/2, H/2 + 50);
      }
    }
  }
  ctx.restore();
}

// ==========================================
// GAME LOOP
// ==========================================
let lastTime = performance.now();
let accumulator = 0;
const TIME_STEP = 1000 / 60; 

function gameLoop(currentTime) {
  if (!currentTime) currentTime = performance.now();
  let deltaTime = currentTime - lastTime;
  lastTime = currentTime;
  
  if (deltaTime > 100) deltaTime = 100; 
  
  accumulator += deltaTime * gameSpeed;
  
  let updates = 0;
  while (accumulator >= TIME_STEP) {
      update();
      accumulator -= TIME_STEP;
      updates++;
      if (updates > 500) { accumulator = 0; break; }
  }
  
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
