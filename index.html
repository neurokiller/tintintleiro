<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>TINTINTLEIRO - GLÓRIA À CHINA</title>
<style>
  body { margin: 0; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; }
  canvas { border: 4px solid #f00; box-shadow: 0 0 50px #f00; }
  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 10; cursor: pointer;
  }
  #startScreen h1 { color: #f00; font-size: 50px; text-shadow: 0 0 20px #f00; margin-bottom: 10px; text-align: center;}
  #startScreen p { color: #fff; font-size: 20px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<audio id="bgm" src="music.mp3" loop></audio>

<div id="startScreen" onclick="startGame()">
  <h1>GLÓRIA À CHINA</h1>
  <p>[ CLIQUE AQUI PARA LIGAR A MÚSICA E JOGAR ]</p>
</div>

<canvas id="game" width="800" height="900"></canvas>

<script>
// ==========================================
// ÁUDIO
// ==========================================
let bgm;
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  bgm = document.getElementById('bgm');
  bgm.volume = 0.4;
  bgm.play().catch(e => console.log("Erro no áudio:", e));
  window.focus();
}

function triggerGlitchAudio() {
  if (!bgm) return;
  try {
    bgm.playbackRate = 2.5; 
    bgm.preservesPitch = false;
  } catch (e) { console.error(e); }
}

function resetAudio() {
  if (!bgm) return;
  try {
    bgm.playbackRate = 1.0;
    bgm.preservesPitch = true;
  } catch (e) { console.error(e); }
}

// ==========================================
// CONFIGURAÇÃO DO JOGO
// ==========================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let bossImg = new Image();
bossImg.src = 'boss.png';

const keys = {};
let player, boss, bullets, playerBullets, lasers;
let gameOver, gameWin, levelCleared, invulnerable, screenShake, bombs, bombCooldown;
let currentLevel = 1;

// ==========================================
// FUNDO (Letras chinesas vermelhas)
// ==========================================
const bgCanvas = document.createElement('canvas');
bgCanvas.width = W; bgCanvas.height = H;
const bgCtx = bgCanvas.getContext('2d');
const chineseChars = ["死亡", "地獄", "血", "恐怖", "中國", "雷", "電", "必殺", "狂気", "紅色", "神", "魔", "殺", "死", "雷"];

function generateBackground() {
  bgCtx.fillStyle = '#050000';
  bgCtx.fillRect(0, 0, W, H);
  bgCtx.textAlign = "center";
  for (let i = 0; i < 180; i++) {
    let text = chineseChars[Math.floor(Math.random() * chineseChars.length)];
    let x = Math.random() * W;
    let y = Math.random() * H;
    let size = 15 + Math.random() * 45;
    let alpha = 0.2 + Math.random() * 0.6;
    bgCtx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
    bgCtx.font = `bold ${size}px "Noto Sans CJK SC", sans-serif`;
    bgCtx.fillText(text, x, y);
  }
}
generateBackground();

const glitchText = ["TIN TIN TLOIN", "FIRST EVER!!!!!!!!!!", "GLÓRIA À CHINA", "MORTE", "HELL", "死"];

// ==========================================
// CONTROLE DE NÍVEIS
// ==========================================
function setupLevel(level) {
  currentLevel = level;
  
  // A cada nível, o boss tem mais vida
  let bossHp = 1500 + (level * 800); 
  
  player = { x: W/2, y: H - 100, r: 3, speed: 8, cooldown: 0, lives: 3 };
  boss = { x: W/2, y: 200, r: 80, hp: bossHp, maxHp: bossHp, timer: 0 };
  bullets = []; playerBullets = []; lasers = [];
  
  gameOver = false; 
  gameWin = false; 
  levelCleared = false;
  invulnerable = 0; 
  screenShake = 0;
  bombs = 3; 
  bombCooldown = 0;
  
  resetAudio();
}

// Iniciar Jogo
function initGame() {
  setupLevel(1);
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  
  // Avançar de Nível
  if (levelCleared && k === 'z') {
    if (currentLevel < 6) {
      setupLevel(currentLevel + 1);
    }
    return;
  }

  // Usar bomba
  if (k === 'x' && !gameOver && !gameWin && !levelCleared && bombs > 0 && bombCooldown <= 0) {
    bombs--;
    bullets = []; 
    lasers = [];
    boss.hp -= 300; 
    screenShake = 30;
    bombCooldown = 30;
  }
  
  // Reiniciar se perder
  if (k === 'r' && (gameOver || gameWin)) {
    initGame();
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function update() {
  if (gameOver || gameWin || levelCleared) return;
  if (bombCooldown > 0) bombCooldown--;

  // Movimento Jogador
  if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
  if (keys['arrowright'] || keys['d']) player.x += player.speed;
  if (keys['arrowup'] || keys['w']) player.y -= player.speed;
  if (keys['arrowdown'] || keys['s']) player.y += player.speed;
  player.x = Math.max(20, Math.min(W - 20, player.x));
  player.y = Math.max(20, Math.min(H - 20, player.y));

  if (player.cooldown > 0) player.cooldown--;

  // Tiro do Jogador
  if ((keys['z'] || keys[' ']) && player.cooldown <= 0) {
    playerBullets.push({ x: player.x, y: player.y - 20, r: 5, vy: -18, damage: 25 });
    player.cooldown = 4;
  }

  // Movimento do Boss (Fica mais rápido e errático)
  let speedMult = 1 + (currentLevel * 0.15);
  boss.x = W/2 + Math.sin(boss.timer / (80 / speedMult)) * 200;
  boss.y = 200 + Math.cos(boss.timer / (100 / speedMult)) * 50;
  boss.timer++;

  // Dificuldade do Boss
  let fireRate = Math.max(8, 25 - (currentLevel * 2)); 
  let bulletSpeed = 3.5 + (currentLevel * 0.4);
  let laserRate = Math.max(80, 220 - (currentLevel * 25));

  // Atirar balas
  if (boss.timer % Math.floor(fireRate) === 0) {
    const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
    let spread = Math.min(4, 1 + Math.floor(currentLevel / 2)); // Mais balas por vez nos níveis altos
    
    for(let i = -spread; i <= spread; i++) {
      bullets.push({
        x: boss.x, y: boss.y, 
        vx: Math.cos(angle + i * 0.2) * bulletSpeed,
        vy: Math.sin(angle + i * 0.2) * bulletSpeed,
        r: 10, 
        color: ['#0f0', '#f00', '#ff0', '#00f', '#ffa500'][Math.floor(Math.random() * 5)]
      });
    }
  }

  // Laser
  if (boss.timer % Math.floor(laserRate) === 0) {
    const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
    // No nível 6, atira dois lasers de uma vez
    lasers.push({ angle: angle, life: 70, warning: 40 });
    if (currentLevel === 6) {
      lasers.push({ angle: angle + Math.PI/4, life: 70, warning: 40 });
    }
  }

  if (invulnerable > 0) invulnerable--;
  if (screenShake > 0) screenShake--;

  // COLISÃO: Tiros do jogador no Boss
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    let pb = playerBullets[i];
    if (!pb) continue;
    
    pb.y += pb.vy;
    let dx = pb.x - boss.x; let dy = pb.y - boss.y;
    
    if (dx*dx + dy*dy < (boss.r + pb.r)*(boss.r + pb.r)) {
      boss.hp -= pb.damage; 
      playerBullets.splice(i, 1);
      if (boss.hp <= 0) { 
        boss.hp = 0; 
        if (currentLevel === 6) {
          gameWin = true; 
        } else {
          levelCleared = true;
        }
        triggerGlitchAudio(); 
      }
    } else if (pb.y < 0) {
      playerBullets.splice(i, 1);
    }
  }

  // COLISÃO: Balas do Boss no Jogador
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    if (!b) continue;
    
    b.x += b.vx; b.y += b.vy;
    let dx = b.x - player.x; let dy = b.y - player.y;
    
    if (invulnerable <= 0 && dx*dx + dy*dy < (b.r + player.r)*(b.r + player.r)) {
      player.lives--; 
      invulnerable = 120; 
      bullets = []; 
      screenShake = 20;
      if (player.lives <= 0) gameOver = true;
      break; 
    }
    
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      bullets.splice(i, 1);
    }
  }

  // COLISÃO: Laser no Jogador
  for (let i = lasers.length - 1; i >= 0; i--) {
    let l = lasers[i];
    if (!l) continue;
    
    l.life--; l.warning--;
    if (l.warning <= 0 && invulnerable <= 0) {
      let dist = Math.abs((player.x - boss.x) * Math.sin(l.angle) - (player.y - boss.y) * Math.cos(l.angle));
      if (dist < 25) {
        player.lives--; 
        invulnerable = 120; 
        bullets = []; 
        screenShake = 20;
        if (player.lives <= 0) gameOver = true;
      }
    }
    if (l.life <= 0) lasers.splice(i, 1);
  }
}

function draw() {
  ctx.save();
  if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);

  // Fundo
  ctx.drawImage(bgCanvas, 0, 0);

  if (!gameOver && !gameWin && !levelCleared) {
    // Boss
    ctx.save();
    ctx.translate(boss.x, boss.y);
    if (bossImg.complete && bossImg.naturalWidth !== 0) {
      ctx.drawImage(bossImg, -boss.r, -boss.r, boss.r * 2, boss.r * 2);
    } else {
      ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(0, 0, boss.r, 0, Math.PI*2); ctx.fill();
    }
    // Olhos do boss
    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(-30, -20, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(30, -20, 10, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Lasers
    for (let l of lasers) {
      const eyeX = boss.x + (Math.cos(l.angle) > 0 ? 30 : -30);
      const eyeY = boss.y - 20;
      
      if (l.warning > 0) {
        ctx.strokeStyle = `rgba(255, 0, 0, ${Math.random() * 0.6 + 0.2})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(eyeX, eyeY); ctx.lineTo(eyeX + Math.cos(l.angle) * 2000, eyeY + Math.sin(l.angle) * 2000); ctx.stroke();
      } else {
        ctx.strokeStyle = '#f00'; ctx.lineWidth = 30;
        ctx.beginPath(); ctx.moveTo(eyeX, eyeY); ctx.lineTo(eyeX + Math.cos(l.angle) * 2000, eyeY + Math.sin(l.angle) * 2000); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(eyeX, eyeY); ctx.lineTo(eyeX + Math.cos(l.angle) * 2000, eyeY + Math.sin(l.angle) * 2000); ctx.stroke();
      }
    }

    // Tiros do jogador
    for (let pb of playerBullets) {
      ctx.fillStyle = '#0ff';
      ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }

    // Balas do boss
    for (let b of bullets) {
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }

    // Jogador (Guitarra)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(-Math.PI / 8);
    if (invulnerable > 0 && Math.floor(boss.timer / 5) % 2 === 0) ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.ellipse(0, 12, 12, 16, 0, 0, Math.PI*2); ctx.fill(); 
    ctx.fillStyle = '#D2B48C'; ctx.fillRect(-4, -30, 8, 35); 
    ctx.fillStyle = '#8B4513'; ctx.fillRect(-6, -36, 12, 8); 
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; 
    ctx.beginPath(); ctx.moveTo(-2, -35); ctx.lineTo(-2, 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, -35); ctx.lineTo(2, 20); ctx.stroke();
    ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(0, 12, 3, 0, Math.PI*2); ctx.fill(); 
    ctx.restore();

    // HUD
    ctx.fillStyle = '#111'; ctx.fillRect(100, 40, 600, 40);
    ctx.strokeStyle = '#f00'; ctx.lineWidth = 4; ctx.strokeRect(100, 40, 600, 40);
    let hpWidth = 600 * (boss.hp / boss.maxHp);
    ctx.fillStyle = boss.hp > (boss.maxHp/2) ? '#f00' : '#ff0';
    ctx.fillRect(100, 40, hpWidth, 40);
    
    ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = "center";
    ctx.fillText(`TINTINTLEIRO - NÍVEL ${currentLevel}`, W/2, 70);
    
    ctx.textAlign = "left"; ctx.font = 'bold 24px monospace'; ctx.fillStyle = '#f00';
    ctx.fillText("VIDAS: " + "❤".repeat(player.lives), 100, 120);
    ctx.fillStyle = '#0ff'; ctx.font = 'bold 20px monospace';
    ctx.fillText(`BOMBAS: ${bombs} [X]`, 100, 150);
  }

  // TELA DE LEVEL CLEARED (Vitória do nível)
  if (levelCleared) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    const shake = Math.random() * 40 - 20;
    ctx.save(); ctx.translate(shake, shake); ctx.textAlign = "center";
    
    ctx.fillStyle = '#0f0'; ctx.font = 'bold 80px Impact, sans-serif';
    ctx.fillText("VITÓRIA", W/2, H/2 - 100);

    // Enche a tela de "VITÓRIA"
    for(let i=0; i<30; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#0f0' : '#fff';
        ctx.font = `bold ${20 + Math.random() * 60}px Impact, sans-serif`;
        ctx.fillText("VITÓRIA", Math.random()*W, Math.random()*H);
    }
    
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px monospace';
    ctx.fillText("Aperte Z para continuar", W/2, H - 100);
    ctx.restore();
  }

  // TELA DE GAME OVER
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
    const shake = Math.random() * 30 - 15;
    ctx.save(); ctx.translate(shake, shake); ctx.textAlign = "center";
    ctx.fillStyle = '#f00'; ctx.font = 'bold 70px Impact, sans-serif';
    ctx.fillText("VOCÊ MORREU", W/2, H/2 - 100);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace';
    ctx.fillText("Aperte R para voltar ao Nível 1", W/2, H/2 + 50);
    ctx.restore();
  }

  // TELA DE VITÓRIA FINAL (Nível 6)
  if (gameWin) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    const shake = Math.random() * 40 - 20;
    ctx.save(); ctx.translate(shake, shake); ctx.textAlign = "center";
    
    ctx.fillStyle = '#0f0'; ctx.font = 'bold 70px Impact, sans-serif';
    ctx.fillText("VOCÊ VENCEU O INFERNO!", W/2, H/2 - 100);

    for(let i=0; i<35; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? (Math.random() > 0.5 ? '#0f0' : '#f0f') : '#fff';
        ctx.font = `bold ${20 + Math.random() * 60}px Impact, sans-serif`;
        ctx.fillText(glitchText[Math.floor(Math.random() * glitchText.length)], W/2 + (Math.random()*500-250), H/2 + (Math.random()*500-250));
    }
    ctx.restore();
    
    ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace';
    ctx.fillText("Aperte R para jogar de novo", W/2, H - 100);
  }

  ctx.restore(); 
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Inicializa o jogo pela primeira vez
initGame();
gameLoop();
</script>
</body>
</html>
